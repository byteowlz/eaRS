[workspace]
members = ["cargo:."]

# Config for 'dist'
[dist]
# The preferred dist version to use in CI (Cargo.toml SemVer syntax)
cargo-dist-version = "0.28.7-prerelease.1"
# CI backends to support
ci = "github"
# The installers to generate for each app
installers = ["homebrew"]
# A GitHub repo to push Homebrew formulas to
tap = "byteowlz/homebrew-tap"
# Target platforms to build apps for (Rust target-triple syntax).
# Linux prebuilts are omitted: cargo-dist builds Linux via cargo-zigbuild,
# whose pkg-config sysroot cannot resolve the C system libraries eaRS links
# (ALSA, dbus). Linux users install from source. Revisit in trx-bvrd.
targets = ["aarch64-apple-darwin", "x86_64-apple-darwin", "x86_64-pc-windows-msvc"]
# Path that installers should place binaries in
install-path = "CARGO_HOME"
# Publish jobs to run in CI
publish-jobs = ["homebrew"]
# Whether to install an updater program
install-updater = false

# CPU-only variant (default)
[[dist.variants]]
name = "cpu"
targets = ["aarch64-apple-darwin", "x86_64-apple-darwin", "x86_64-pc-windows-msvc"]

# Metal variant for Apple Silicon
[[dist.variants]]
name = "metal"
features = ["metal"]
targets = ["aarch64-apple-darwin"]

# CUDA variant for NVIDIA GPUs
[[dist.variants]]
name = "cuda"
features = ["cuda"]
targets = ["x86_64-pc-windows-msvc"]

[workspace.metadata.dist.dependencies.apt]
libasound2-dev = "*"
pkg-config = "*"
libssl-dev = "*"
libdbus-1-dev = "*"
