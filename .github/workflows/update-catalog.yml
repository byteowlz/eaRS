name: Update model catalog

# Regenerates src/server/catalog.json from the handy-computer HF org and opens a
# PR when the streaming-model list changes. Runs weekly and on demand. The
# catalog is data-authored: the generator derives everything mechanically from
# HF cards; editorial curation lives in scripts/gen_catalog.py (CURATION).

on:
  schedule:
    - cron: "0 6 * * 1" # Mondays 06:00 UTC
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  regenerate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Regenerate catalog
        run: uv run scripts/gen_catalog.py src/server/catalog.json

      - name: Open PR on change
        uses: peter-evans/create-pull-request@v6
        with:
          commit-message: "chore(catalog): refresh transcribe.cpp model catalog"
          title: "chore(catalog): refresh transcribe.cpp model catalog"
          body: |
            Automated regeneration of `src/server/catalog.json` from the
            `handy-computer` Hugging Face org via `scripts/gen_catalog.py`.

            Review the diff for newly listed or changed streaming models before
            merging. Editorial curation (recommended flag, names, descriptions,
            hidden models) lives in the generator's `CURATION` table.
          branch: chore/refresh-catalog
          delete-branch: true
          add-paths: src/server/catalog.json
