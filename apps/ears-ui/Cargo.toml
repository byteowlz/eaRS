[package]
name = "ears-ui"
version = "0.1.0"
edition = "2024"
description = "GPUI dictation companion UI for eaRS: floating overlay, tray, settings"
license = "MIT"
repository = "https://github.com/tommyfalkowski/eaRS"
publish = false

[[bin]]
name = "ears-ui"
path = "src/main.rs"

[dependencies]
ears = { path = "../..", package = "eaRS" }
gpui = "0.2.2"
anyhow = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "0.9"
dirs = "6.0"
crossbeam-channel = "0.5"
tray-icon = "0.21"
auto-launch = "0.5"
raw-window-handle = "0.6"
smallvec = "1"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-app-kit = { version = "0.3", features = ["NSWindow", "NSPanel", "NSScreen", "NSEvent", "NSWorkspace", "NSResponder", "NSView", "NSApplication", "NSRunningApplication", "NSAccessibility", "NSGraphics"] }
objc2-foundation = { version = "0.3", features = ["NSGeometry", "NSString", "NSArray", "NSDictionary", "NSValue"] }

[target.'cfg(target_os = "linux")'.dependencies]
gtk = "0.18"
