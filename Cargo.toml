[package]
name = "eaRS"
version = "0.6.0"
edition = "2024"
description = "Easy automatic speech recognition library using Kyutai's STT models"
license = "MIT"
repository = "https://github.com/tommyfalkowski/eaRS"
authors = ["Tommy Falkowski"]
homepage = "https://byteowlz.com"

[workspace]
members = ["apps/ears-ui"]
# simple_gui (Tauri) has its own lockfile/toolchain and is deprecated in favor
# of apps/ears-ui; keep it out of the workspace so `cargo` in that directory
# does not try to join this one.
exclude = ["apps/simple_gui/src-tauri"]

[build-dependencies]
pkg-config = "0.3"

[lib]
name = "ears"
path = "src/lib.rs"

[[bin]]
name = "ears"
path = "src/main.rs"

[[bin]]
name = "ears-server"
path = "src/bin/ears-server.rs"

[[bin]]
name = "ears-dictation"
path = "src/bin/ears-dictation.rs"

[dependencies]
aho-corasick = "1"
sha2 = "0.10"
# Shared canonical identity/evidence model, pinned to a pushed voqx commit so
# CI and fresh clones build without a sibling checkout.
voqx-core = { git = "https://github.com/byteowlz/voqx.git", rev = "36ca757a7f4f5f28bfc2b4ed97cfe63919e5082e" }
voqx-recognition = { git = "https://github.com/byteowlz/voqx.git", rev = "36ca757a7f4f5f28bfc2b4ed97cfe63919e5082e", optional = true }
anyhow = "1.0"
atty = "0.2"
candle = { version = "0.9", package = "candle-core" }
candle-nn = "0.9"
clap = { version = "4.4.12", features = ["derive"] }
cpal = "0.16"
crossbeam-channel = "0.5"
hf-hub = "0.4.3"
kaudio = "0.2.1"
moshi = "0.6.4"
# Pin the Rust ONNX Runtime binding expected by parakeet-rs. Its feature must
# activate this pin: cargo install ignores Cargo.lock unless --locked is passed,
# and newer ort pre-releases break parakeet-rs's Session::builder() call.
# Keep defaults off: dynamic loading must not download/link another runtime.
ort = { version = "=2.0.0-rc.12", optional = true, default-features = false, features = ["load-dynamic"] }
serde = { version = "1.0.210", features = ["derive"] }
serde_json = "1.0.115"
toml = "0.9"
dirs = "6.0"
time = { version = "0.3", features = ["formatting"] }
tokio = { version = "1.0", features = ["full"] }
tokio-tungstenite = "0.28"
futures = "0.3"
indicatif = "0.17.5"
uuid = { version = "1.0", features = ["v4"] }
colored = "3.0"
libc = "0.2"
enigo = "0.6"
rdev = "0.5"
futures-util = "0.3"
ctrlc = { version = "3.4", features = ["termination"] }
# cudarc auto-detects CUDA version from the build system (nvcc).
# Users can override by setting CUDARC_CUDA_VERSION environment variable.
#
# Must stay >= 0.19.9: candle-core already requires cudarc ^0.19, and each
# cudarc release hard-codes the list of CUDA toolkit versions it recognizes.
# The old `0.17` pin (a) could never unify with candle's 0.19 so both got
# compiled, and (b) only knows up to CUDA 13.0, so `--features nvidia` failed
# on newer toolkits (e.g. CUDA 13.3) with "Unsupported cuda toolkit version".
# 0.19.4 caps at 13.2; 0.19.9 is the first that recognizes 13.3.
cudarc = { version = "0.19.9", optional = true, features = ["cuda-version-from-build-system"] }
notifica = "3.0.2"
regex = "1.10"
arboard = { version = "3.6", default-features = false }
# parakeet-rs (Nemotron streaming); its feature activates the exact ort pin.
parakeet-rs = { package = "parakeet-rs", git = "https://github.com/altunenes/parakeet-rs.git", rev = "086e3bb734dd9a3f01e4e99ef6895da0db85b47a", optional = true, default-features = false }
# Native Moonshine C API wrapper, with its audio decoder disabled (we use kaudio).
moonshine-rs = { version = "=0.2.6", optional = true, default-features = false }

# transcribe.cpp GGUF streaming engine. Pinned to the 0.2.3 release (upgraded
# from 0.1.3: brings ggml 0.20.2, a parakeet buffered-stream tail-loss fix, and
# proper propagation of C BLAS link metadata). Backend features (metal/cuda)
# are forwarded from eaRS's `apple`/`nvidia` features.
# NOTE: on Arch, the build.rs cblas probe is still required — upstream links
# what find_package(BLAS) returns, which on Arch is the Fortran-only libblas
# (the C wrappers live in the separate `cblas` package).
transcribe-cpp = { git = "https://github.com/handy-computer/transcribe.cpp.git", rev = "63a44d9239d610b3908e8a66b384924cd4a77217", optional = true, default-features = false }
# `ears models refresh` fetches the maintained catalog.json. Reuses hf-hub's TLS
# stack (native-tls); already in the tree, so this adds no new transitive cost.
ureq = { version = "2.12", optional = true }

# Platform-specific sentencepiece configuration
# All platforms: compile from source (static linking).
[target.'cfg(target_os = "linux")'.dependencies]
sentencepiece = { version = "0.12", features = ["static"] }
uinput = "0.1"
# hf-hub's sync (ureq) path uses native-tls -> openssl-sys on Linux. Build
# OpenSSL from source so cross-compiled release artifacts (cargo-zigbuild) do
# not depend on a system OpenSSL that isn't present in the cross sysroot.
openssl = { version = "0.10", features = ["vendored"] }

[target.'cfg(not(target_os = "linux"))'.dependencies]
sentencepiece = { version = "0.12", features = ["static"] }

[target.'cfg(target_os = "macos")'.dependencies]
# Frontmost-app detection for context profiles (NSWorkspace + AX window title).
objc2-app-kit = { version = "0.3", features = ["NSWorkspace", "NSRunningApplication"] }
objc2-foundation = { version = "0.3", features = ["NSString", "NSURL"] }
objc2-core-foundation = { version = "0.3", features = ["CFBase", "CFString"] }

[target.'cfg(target_os = "windows")'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_UI_WindowsAndMessaging", "Win32_System_Threading"] }

[features]
default = []
cudnn = ["candle/cudnn", "candle-nn/cudnn"]
hooks = []
# Opt-in evidence adapter only; never loads models/profiles automatically.
speaker-voqx = ["dep:voqx-recognition"]

# Engines
# parakeet-rs Nemotron streaming engine (ort 2.0.0-rc.12). Activate the exact
# ort pin as well as parakeet-rs.
# Dynamic ORT avoids symbol collisions with eaRS's statically linked
# SentencePiece protobuf-lite. The server locates ORT at runtime; override
# discovery with ORT_DYLIB_PATH.
parakeet-rs = ["dep:parakeet-rs", "dep:ort", "parakeet-rs/cpu", "parakeet-rs/load-dynamic"]
# transcribe.cpp GGUF engine (streaming multitalker/nemotron models).
# CPU-only by default; combine with `metal`/`cuda` for GPU compute.
transcribe-cpp = ["dep:transcribe-cpp", "dep:ureq"]
# Native CPU streaming; model defaults to cached German Tiny, or a local ORT export.
moonshine = ["dep:moonshine-rs", "dep:ureq"]

# Acceleration (shared flags)
nvidia = ["dep:cudarc", "candle/cuda", "candle-nn/cuda", "transcribe-cpp?/cuda"]
apple = ["candle/metal", "candle-nn/metal", "transcribe-cpp?/metal"]
amd = []
directml = []

# Backwards-compat aliases
cuda = ["nvidia"]
metal = ["apple"]

[profile.release]
debug = true

[profile.release-no-debug]
inherits = "release"
debug = false

# The profile that 'dist' will build with
[profile.dist]
inherits = "release"
lto = "thin"

[patch.crates-io]
sentencepiece-sys = { path = "vendor/sentencepiece-sys" }
