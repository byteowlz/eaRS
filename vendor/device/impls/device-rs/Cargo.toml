[workspace]
members = ["scene", "render-wgpu", "gpui"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
publish = false

[workspace.dependencies]
device-scene = { path = "scene" }
device-render-wgpu = { path = "render-wgpu" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
glam = { version = "0.33", features = ["serde", "bytemuck"] }
bytemuck = { version = "1", features = ["derive"] }
image = { version = "0.25", default-features = false, features = ["png"] }
