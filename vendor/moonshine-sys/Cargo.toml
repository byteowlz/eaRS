[package]
name = "moonshine-sys"
version = "0.2.6"
edition = "2021"
license = "MIT OR Apache-2.0"
description = "eaRS-vendored Moonshine C API with the final-audio runtime fix"
build = "build.rs"

[lib]
path = "src/lib.rs"

[build-dependencies]
anyhow = "1"
bindgen = "0.69"
cmake = "0.1"
flate2 = "1"
tar = "0.4"
sha2 = "0.10"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ureq = "2.12"
